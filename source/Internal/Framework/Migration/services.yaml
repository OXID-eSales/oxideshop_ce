imports:
  - { resource: Command/services.yaml }

services:
  _defaults:
    autowire: true
    public: false

  OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationExecutor: ~

  OxidEsales\EshopCommunity\Internal\Framework\Migration\CommunityEditionMigrationPathProvider:
    tags:
      - { name: 'oxid_esales.migration_path_provider', priority: 300 }

  OxidEsales\EshopCommunity\Internal\Framework\Migration\ProjectMigrationPathProvider:
    tags:
      - { name: 'oxid_esales.migration_path_provider' }

  OxidEsales\EshopCommunity\Internal\Framework\Migration\TaggedMigrationExecutor:
    arguments:
      $providers: !tagged_iterator oxid_esales.migration_path_provider

  OxidEsales\EshopCommunity\Internal\Framework\Migration\ConfigurableMigrationExecutorInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Migration\CompositeMigrationExecutor
    public: true
    arguments:
      $executors: !iterator
        - '@OxidEsales\EshopCommunity\Internal\Framework\Migration\TaggedMigrationExecutor'
        - '@OxidEsales\EshopCommunity\Internal\Framework\Module\Migration\ModuleMigrationExecutor'

  OxidEsales\EshopCommunity\Internal\Framework\Migration\SqlCollectingMigrationExecutor:
    decorates: OxidEsales\EshopCommunity\Internal\Framework\Migration\ConfigurableMigrationExecutorInterface

  oxid_esales.migration.sql_collecting_tagged_migration_executor:
    class: OxidEsales\EshopCommunity\Internal\Framework\Migration\SqlCollectingMigrationExecutor
    decorates: OxidEsales\EshopCommunity\Internal\Framework\Migration\TaggedMigrationExecutor

  oxid_esales.migration.sql_collecting_module_migration_executor:
    class: OxidEsales\EshopCommunity\Internal\Framework\Migration\SqlCollectingMigrationExecutor
    decorates: OxidEsales\EshopCommunity\Internal\Framework\Module\Migration\ModuleMigrationExecutor

  OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationRunnerInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationRunner

  OxidEsales\EshopCommunity\Internal\Framework\Migration\SqlCapturingMigrationRunner:
    decorates: OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationRunnerInterface

  OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationAvailabilityCheckerInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationAvailabilityChecker

  OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationOptionsForwarderInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationOptionsForwarder

  OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationExitCodeResolverInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationExitCodeResolver

  OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationSqlOutputInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationSqlOutput
    arguments:
      Symfony\Component\Filesystem\Filesystem: '@oxid_esales.symfony.file_system'
