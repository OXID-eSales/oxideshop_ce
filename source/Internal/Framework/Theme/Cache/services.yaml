services:
  _defaults:
    autowire: true

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\ThemeSettingCacheInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\ThemeSettingCache

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\InMemoryThemeSettingCache:
    decorates: OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\ThemeSettingCacheInterface
    tags:
      - { name: kernel.event_subscriber }

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\ActiveThemeCacheInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\ActiveThemeCache

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\InMemoryActiveThemeCache:
    decorates: OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\ActiveThemeCacheInterface
    tags:
      - { name: kernel.event_subscriber }

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\ThemeSourceCacheInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\ThemeSourceCache

  oxid_esales.theme.cache.invalidate_theme_cache_event_subscriber:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Cache\InvalidateThemeCacheEventSubscriber
    arguments:
      OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Cache\ThemeConfigurationCacheInterface: '@oxid_esales.theme.configuration.resolver_cache'
    tags:
      - { name: kernel.event_subscriber }
