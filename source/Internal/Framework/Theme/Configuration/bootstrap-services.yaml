services:
  _defaults:
    autowire: true

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\DataMapper\ThemeConfigurationDataMapperInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\DataMapper\ThemeConfigurationDataMapper

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Provider\ThemeConfigurationProviderInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Provider\ThemeConfigurationProvider

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Cache\ThemeConfigurationCacheInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Cache\ThemeConfigurationCache

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Definition\TreeBuilderFactoryInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Definition\TreeBuilderFactory

  oxid_esales.theme.configuration.node:
    class: Symfony\Component\Config\Definition\NodeInterface
    factory: ['@OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Definition\TreeBuilderFactoryInterface', 'create']

  oxid_esales.theme.configuration.processor:
    class: Symfony\Component\Config\Definition\Processor

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Dao\ThemeConfigurationDaoInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Configuration\Dao\ThemeConfigurationDao
    arguments:
      Symfony\Component\Config\Definition\NodeInterface: '@oxid_esales.theme.configuration.node'
      Symfony\Component\Config\Definition\Processor: '@oxid_esales.theme.configuration.processor'
    public: true
