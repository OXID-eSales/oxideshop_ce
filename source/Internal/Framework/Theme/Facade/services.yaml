services:
  _defaults:
    autowire: true

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Facade\ThemeSettingServiceInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Facade\ThemeSettingService
    arguments:
      $activeThemeId: '%oxid_esales.theme.active%'
      $environment: '%env(string:default::OXID_ENV)%'
    public: true

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Facade\ActiveThemeProviderInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Facade\ActiveThemeProvider
    arguments:
      $activeThemeId: '%oxid_esales.theme.active%'
      $shopId: '%oxid_esales.current_shop_id%'
    public: true

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Facade\CachedActiveThemeProvider:
    decorates: OxidEsales\EshopCommunity\Internal\Framework\Theme\Facade\ActiveThemeProviderInterface
    arguments:
      $activeThemeId: '%oxid_esales.theme.active%'

  OxidEsales\EshopCommunity\Internal\Framework\Theme\Facade\ThemePathProviderInterface:
    class: OxidEsales\EshopCommunity\Internal\Framework\Theme\Facade\ThemePathProvider
    arguments:
      $shopId: '%oxid_esales.current_shop_id%'
    public: true
