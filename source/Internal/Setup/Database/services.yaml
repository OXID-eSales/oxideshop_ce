services:
    _defaults:
        autowire: true
        public: false

    OxidEsales\EshopCommunity\Internal\Setup\Database\Service\DatabaseCreatorInterface:
        class: OxidEsales\EshopCommunity\Internal\Setup\Database\Service\DatabaseCreator

    OxidEsales\EshopCommunity\Internal\Setup\Database\Service\DatabaseInitiatorInterface:
        class: OxidEsales\EshopCommunity\Internal\Setup\Database\Service\DatabaseInitiator
        arguments:
            $migrationExecutor: '@OxidEsales\EshopCommunity\Internal\Framework\Migration\MigrationExecutor'
            $taggedMigrationExecutor: '@OxidEsales\EshopCommunity\Internal\Framework\Migration\TaggedMigrationExecutor'

    OxidEsales\EshopCommunity\Internal\Setup\Database\Service\DatabaseInstallerInterface:
        class: OxidEsales\EshopCommunity\Internal\Setup\Database\Service\DatabaseInstaller

    OxidEsales\EshopCommunity\Internal\Setup\Database\Service\DatabaseCheckerInterface:
        class: OxidEsales\EshopCommunity\Internal\Setup\Database\Service\DatabaseChecker
